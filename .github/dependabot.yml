version: 2
updates:
  # Maintain dependencies for the Frontend (Node/npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the exact same version, or the app
      # crashes at startup with React error #527. Bump them in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui:
        patterns:
          - "@mui/*"

  # Maintain dependencies for the Backend (Python/pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Docker base images in the Frontend
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Maintain Docker base images in the Backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      # New Python minor versions ship before wheels exist for native deps
      # (e.g. grpcio), which breaks the build. Bump these manually.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
